# Schedules — Automation manifest
#
# IMPORTANT: this file does NOT trigger anything. It is a manifest of the
# routines that should run. The actual scheduler is Claude Code's web Routines
# (trigger settings on claude.ai/code), which fire a fresh Claude session at a
# cron time against a specific repo. Those triggers do not read this file.
#
# Two fields describe each routine:
#   enabled: whether we WANT it to run (intent)
#   live:    whether a web trigger actually exists for it right now (reality)
# enabled: true + live: false  =>  needs a web trigger created (see bottom of file).
#
# Keep this file in sync with the real triggers. To see the real triggers in an
# interactive/authorized session, list them via the remote trigger tooling.

schedules:
  # --- Live: web triggers that actually fire (verified 2026-07-30) ---

  - name: "Morning Chief of Staff"
    skill: "/gm"
    repo: "vojtakopal/ai-chief-of-staff"
    frequency: "Daily, 07:30 Europe/Prague (see drift note)"
    cron: "30 7 * * *"
    timezone: "Europe/Prague"
    enabled: true
    live: true
    notes: >
      Runs /gm in a fresh session and writes the briefing into today's Daily
      Journal. DRIFT: the real web trigger is pinned to 05:00 UTC (cron '0 5 * * *'),
      which is 07:00 Prague in summer and 06:00 in winter - it does NOT track 07:30
      Prague. Fix by recreating the trigger as timezone-aware Europe/Prague at 07:30.

  - name: "Data Pipeline Review"
    skill: "/review-pipelines"
    repo: "apify/vko-data-platform-admin"
    frequency: "Daily, 18:00 Europe/Prague"
    cron: "0 16 * * *"            # 16:00 UTC = 18:00 Prague (summer); drifts to 17:00 in winter
    timezone: "UTC (pinned)"
    enabled: true
    live: true
    notes: "Reviews production data-pipeline changes for next-day-run risk before EOD."

  - name: "PR Code Reviews"
    skill: "(code review - not a slash command)"
    repo: "apify/snowflake-dbt"
    frequency: "Event-driven: fires when a PR is marked ready for review"
    cron: null                     # not time-based
    enabled: true
    live: true
    notes: "Reviews the PR and posts findings as review comments. No clock; triggered by PR events."

  # --- Intended but NOT wired to a web trigger yet (enabled + live:false) ---
  # These will not run until a web trigger is created for each (see bottom of file).
  # NOTE: /triage, /my-tasks and /enrich are the upstream starter commands and are
  # not yet personalised - personalise before wiring them live, or the runs will be generic.

  - name: "Midday Triage"
    skill: "/triage"
    repo: "vojtakopal/ai-chief-of-staff"
    frequency: "Daily, ~12:00 Europe/Prague"
    cron: "3 12 * * *"             # off-minute on purpose
    timezone: "Europe/Prague"
    enabled: true
    live: false
    notes: "Scan channels for items needing attention. Needs a web trigger. Personalise /triage first."

  - name: "Evening Triage"
    skill: "/triage"
    repo: "vojtakopal/ai-chief-of-staff"
    frequency: "Daily, ~17:00 Europe/Prague"
    cron: "3 17 * * *"
    timezone: "Europe/Prague"
    enabled: true
    live: false
    notes: "End-of-day inbox check. Needs a web trigger. Personalise /triage first."

  - name: "Task Check"
    skill: "/my-tasks overdue"
    repo: "vojtakopal/ai-chief-of-staff"
    frequency: "Every 2 hours, 08:00-20:00 Europe/Prague"
    cron: "7 8-20/2 * * *"
    timezone: "Europe/Prague"
    enabled: true
    live: false
    notes: "Warn about overdue or at-risk tasks. Needs a web trigger. Personalise /my-tasks first."

  - name: "Relationship Check"
    skill: "/enrich stale"
    repo: "vojtakopal/ai-chief-of-staff"
    frequency: "Weekly, Monday ~09:00 Europe/Prague"
    cron: "7 9 * * 1"
    timezone: "Europe/Prague"
    enabled: true
    live: false
    notes: "Surface contacts overdue for engagement per tier cadence. Needs a web trigger."

# ---------------------------------------------------------------------------
# Wiring the not-yet-live routines
#
# Web triggers cannot be created from a headless session - they are created in
# Claude Code trigger settings (claude.ai/code) or via the remote trigger API in
# an authorized session. For each routine above with live:false, create a trigger:
#   - Repo:     the `repo` field
#   - Schedule: the `cron` field, timezone Europe/Prague
#   - Prompt:   "Run the <skill> command." (e.g. "Run the /triage command.")
# Then flip live:true here so this manifest keeps matching reality.
# ---------------------------------------------------------------------------
